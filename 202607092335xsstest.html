<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체화면 이미지</title>
    <style>
        /* 브라우저 기본 여백 제거 및 스크롤바 방지 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000; /* 이미지 로딩 전 배경색 */
        }

        .fullscreen-container {
            width: 100%;
            height: 100vh; /* 화면 세로 전체 높이 */
        }

        .fullscreen-container img {
            width: 100%;
            height: 100%;
            /* [중요] 이미지 비율을 유지하면서 화면에 꽉 채웁니다. 
               남는 부분은 잘려 나가며 화면이 왜곡되지 않습니다.
            */
            object-fit: cover; 
            display: block;
        }
    </style>
</head>
<body>

    <div class="fullscreen-container">
        <img src="202607092335xsstest.png" alt="전체화면 배경 이미지">
    </div>

</body>
</html>
